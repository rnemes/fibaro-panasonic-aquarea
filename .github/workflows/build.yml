name: Build QuickApps

# Every push and pull request: lint and format check, Lua syntax check, build the .fqa files.
# A pushed tag like v2.6.2: also create the GitHub release and attach the .fqa files.
# The build fails if the tag doesn't match the "-- version" line in src/main.lua,
# or if a secret variable (Username, password, authCode) has a value in a manifest.
#
# Actions are pinned to exact commits (version in the comment) so a changed tag can't
# change what runs here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Lua 5.3 and luacheck (HC3 runs Lua 5.3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3 lua-check

      - name: Check Lua syntax
        run: find src -name '*.lua' -print0 | xargs -0 -n1 luac5.3 -p

      - name: Lint (luacheck, settings in .luacheckrc)
        run: luacheck src

      - name: Check formatting (StyLua, settings in stylua.toml)
        run: npx --yes @johnnymorganz/stylua-bin@2.0.2 --check src

      - name: Build .fqa files
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/build.py --version "$GITHUB_REF_NAME"
          else
            python3 tools/build.py
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quickapps
          path: dist/*.fqa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quickapps
          path: dist

      - name: Attach .fqa files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.fqa --clobber
          else
            gh release create "$TAG" dist/*.fqa --title "$TAG" --generate-notes
          fi
